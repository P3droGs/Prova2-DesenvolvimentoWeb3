<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McKingReservas — Reserva sua mesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="topo">
    <div class="marca">
      <span class="marca-icone" aria-label="MK"></span>
      <div>
        <h1>McKingReservas</h1>
       
      </div>
    </div>
    <div class="relogio" id="relogio">--:--</div>
  </header>

  <main class="grid">

    <!-- Coluna esquerda: mapa visual -->
    <section class="painel painel-mapa">
      <header class="painel-cabecalho">
        <h2>Mapa do Restaurante</h2>
        <div class="legenda">
          <span class="bola verde"></span>disponível
          <span class="bola amarela"></span>reservado
          <span class="bola vermelha"></span>ocupado
        </div>
      </header>

      <div class="filtros-localizacao" id="filtrosLocalizacao">
        <button data-loc="todas" class="ativo">Todas</button>
        <button data-loc="salão">Salão</button>
        <button data-loc="varanda">Varanda</button>
        <button data-loc="área interna">Área interna</button>
        <button data-loc="mezanino">Mezanino</button>
      </div>

      <div id="mapa" class="mapa"></div>
      <p class="dica">Clique em uma mesa para ver detalhes ou reservar.</p>
    </section>

    <!-- Coluna direita: formulário e lista -->
    <section class="painel painel-lateral">
      <header class="painel-cabecalho">
        <h2>Nova Reserva</h2>
      </header>

      <form id="formReserva" class="formulario">
        <div class="campo">
          <label for="nomeCliente">Nome do cliente</label>
          <input type="text" id="nomeCliente" name="nomeCliente" required minlength="2" />
        </div>

        <div class="campo">
          <label for="contato">Contato</label>
          <input type="text" id="contato" name="contato" placeholder="(00) 00000-0000" required />
        </div>

        <div class="linha">
          <div class="campo">
            <label for="numeroMesa">Mesa</label>
            <select id="numeroMesa" name="numeroMesa" required></select>
          </div>
          <div class="campo">
            <label for="quantidadePessoas">Pessoas</label>
            <input type="number" id="quantidadePessoas" name="quantidadePessoas" min="1" value="2" required />
          </div>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="dataHora">Data e hora</label>
            <input type="datetime-local" id="dataHora" name="dataHora" required />
          </div>
          <div class="campo">
            <label for="duracaoMinutos">Duração (min)</label>
            <input type="number" id="duracaoMinutos" name="duracaoMinutos" min="30" value="90" />
          </div>
        </div>

        <div class="campo">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="2" placeholder="aniversário, restrição alimentar..."></textarea>
        </div>

        <button type="submit" class="botao-principal">Registrar reserva</button>
      </form>

      <div id="alertas" class="alertas"></div>
    </section>

    <!-- Lista de reservas (linha inteira) -->
    <section class="painel painel-lista">
      <header class="painel-cabecalho">
        <h2>Reservas</h2>
        <div class="filtros-reserva">
          <input type="search" id="filtroCliente" placeholder="Filtrar por cliente" />
          <input type="number" id="filtroMesa" placeholder="Mesa" min="1" />
          <input type="date" id="filtroData" />
          <select id="filtroStatus">
            <option value="">Todos os status</option>
            <option value="reservado">Reservado</option>
            <option value="ocupado">Ocupado</option>
            <option value="finalizado">Finalizado</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <button id="btnFiltrar" class="botao-secundario">Filtrar</button>
          <button id="btnLimparFiltros" class="botao-vazio">Limpar</button>
        </div>
      </header>

      <div id="listaReservas" class="lista"></div>
    </section>

  </main>

  <!-- Modal de mesa -->
  <div id="modalMesa" class="modal oculto">
    <div class="modal-conteudo">
      <button class="fechar" id="fecharModal">&times;</button>
      <div id="modalCorpo"></div>
    </div>
  </div>

  <!-- Modal de edição -->
  <div id="modalEditar" class="modal oculto">
    <div class="modal-conteudo">
      <button class="fechar" id="fecharModalEditar">&times;</button>
      <h3>Editar reserva</h3>
      <form id="formEditar" class="formulario">
        <input type="hidden" id="editId" />
        <div class="campo">
          <label>Nome do cliente</label>
          <input type="text" id="editNome" required />
        </div>
        <div class="campo">
          <label>Contato</label>
          <input type="text" id="editContato" required />
        </div>
        <div class="linha">
          <div class="campo">
            <label>Mesa</label>
            <select id="editMesa" required></select>
          </div>
          <div class="campo">
            <label>Pessoas</label>
            <input type="number" id="editPessoas" min="1" required />
          </div>
        </div>
        <div class="linha">
          <div class="campo">
            <label>Data e hora</label>
            <input type="datetime-local" id="editDataHora" required />
          </div>
          <div class="campo">
            <label>Duração (min)</label>
            <input type="number" id="editDuracao" min="30" />
          </div>
        </div>
        <div class="campo">
          <label>Observações</label>
          <textarea id="editObs" rows="2"></textarea>
        </div>
        <button type="submit" class="botao-principal">Salvar alterações</button>
      </form>
    </div>
  </div>

  <footer class="rodape">
    <small>McKingReservas &middot;</small>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
